<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Teacher Ana</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --tx: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --acc: var(--tg-theme-button-color, #7c4dff);
    --acc-tx: var(--tg-theme-button-text-color, #ffffff);
    --ok: #34c759; --no: #ff453a; --gold: #ffb020;
    --r: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { overscroll-behavior: none; }
  main { padding: 16px 16px 96px; max-width: 560px; margin: 0 auto; }
  section { display: none; animation: fade .25s ease; }
  section.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  .hint { color: var(--hint); font-size: 13px; }
  .card { background: var(--bg2); border-radius: var(--r); padding: 16px; }

  /* início */
  .hero { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
  .ring { position: relative; width: 112px; height: 112px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring b { font-size: 22px; } .ring small { color: var(--hint); font-size: 11px; }
  .streak { font-size: 30px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat b { display: block; font-size: 22px; } .stat span { color: var(--hint); font-size: 12px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; margin-top: 12px;
    background: var(--acc); color: var(--acc-tx); font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: var(--bg2); color: var(--tx); }

  /* flashcards */
  .deck { position: relative; height: 300px; margin-top: 18px; perspective: 1000px; touch-action: none; }
  .fc { position: absolute; inset: 0; transition: transform .35s ease; transform-style: preserve-3d; cursor: grab; }
  .fc.drag { transition: none; }
  .face { position: absolute; inset: 0; border-radius: 22px; background: var(--bg2); backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px; text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.12); }
  .face.back { transform: rotateY(180deg); }
  .fc.flip { transform: rotateY(180deg); }
  .word { font-size: 30px; font-weight: 700; }
  .pt { font-size: 24px; font-weight: 600; color: var(--acc); }
  .ex { margin-top: 12px; color: var(--hint); font-style: italic; }
  .dots { margin-top: 10px; letter-spacing: 3px; color: var(--gold); }
  .stamp { position: absolute; top: 18px; padding: 4px 10px; border: 3px solid; border-radius: 8px; font-weight: 800;
    font-size: 18px; opacity: 0; transform: rotate(-12deg); }
  .stamp.ok { left: 18px; color: var(--ok); } .stamp.no { right: 18px; color: var(--no); transform: rotate(12deg); }
  .actions { display: flex; justify-content: center; gap: 22px; margin-top: 18px; }
  .round { width: 62px; height: 62px; border-radius: 50%; border: 0; font-size: 26px; cursor: pointer;
    background: var(--bg2); box-shadow: 0 4px 14px rgba(0,0,0,.1); }
  .bar { height: 8px; background: var(--bg2); border-radius: 8px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--acc); transition: width .3s; }
  .empty { text-align: center; padding: 50px 10px; }
  .empty div { font-size: 56px; }

  /* curso */
  .mod { margin-top: 18px; }
  .path { position: relative; margin-left: 18px; border-left: 3px dashed var(--bg2); padding-left: 18px; }
  .node { position: relative; margin: 10px 0; padding: 10px 12px; border-radius: 14px; background: var(--bg2); }
  .node::before { content: attr(data-i); position: absolute; left: -38px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-content: center; font-size: 13px; font-weight: 700;
    background: var(--bg2); color: var(--hint); border: 3px solid var(--bg); }
  .node.done::before { content: "✓"; background: var(--ok); color: #fff; }
  .node.now { outline: 2px solid var(--acc); }
  .node.now::before { background: var(--acc); color: var(--acc-tx); }
  .node.lock { opacity: .5; }
  .node small { color: var(--hint); }

  /* conquistas */
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge { background: var(--bg2); border-radius: 16px; padding: 14px 6px; text-align: center; font-size: 12px; }
  .badge div { font-size: 32px; margin-bottom: 6px; }
  .badge.off { opacity: .4; filter: grayscale(1); }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--bg);
    border-top: 1px solid var(--bg2); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; border: 0; background: none; color: var(--hint); font-size: 11px; padding: 6px 0; cursor: pointer; }
  nav button span { display: block; font-size: 22px; }
  nav button.on { color: var(--acc); }
  .badge-n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--no);
    color: #fff; font-size: 11px; margin-left: 2px; }
</style>
</head>
<body>
<main>
  <section id="home" class="on"></section>
  <section id="cards"></section>
  <section id="course"></section>
  <section id="ach"></section>
</main>
<nav>
  <button data-t="home" class="on"><span>🏠</span>Início</button>
  <button data-t="cards"><span>🃏</span>Cartões<b id="nb"></b></button>
  <button data-t="course"><span>🗺️</span>Curso</button>
  <button data-t="ach"><span>🏆</span>Conquistas</button>
</nav>

<script>
const tg = window.Telegram ? Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const haptic = (k) => { try { tg && tg.HapticFeedback.impactOccurred(k); } catch (e) {} };

// ---- dados vindos do bot no "#d=..." (base64url de um JSON)
function readData() {
  const m = location.hash.match(/d=([^&]+)/);
  if (!m) return null;
  try {
    let b = m[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    const bytes = Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return null; }
}
const D = readData();
let idx = 0; const res = [];          // estado dos flashcards

function send(obj) {
  if (tg && tg.sendData) tg.sendData(JSON.stringify(obj));   // envia ao bot e fecha o painel
  else alert("Abra o painel pelo Telegram para salvar.");
}

// ---- abas
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button, section").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.t).classList.add("on"); haptic("light");
});

if (!D) {
  $("#home").innerHTML = `<div class="empty"><div>📱</div><h1>Teacher Ana</h1>
    <p class="hint">Abra este painel pelo bot no Telegram: menu → 📱 Painel visual.</p></div>`;
} else {
  renderHome(); renderCards(); renderCourse(); renderAch();
}

// ---- início
function renderHome() {
  const pct = Math.min(1, D.dp / D.go), R = 48, C = 2 * Math.PI * R;
  $("#home").innerHTML = `
    <h1>Hi, ${esc(D.n)}! 👋</h1><div class="hint">${esc(D.acc)}</div>
    <div class="hero">
      <div class="ring">
        <svg width="112" height="112"><circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--bg2)" stroke-width="10"/>
          <circle cx="56" cy="56" r="${R}" fill="none" stroke="${pct >= 1 ? "var(--ok)" : "var(--acc)"}" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg>
        <div class="in"><b>${D.dp}/${D.go}</b><small>meta do dia</small></div>
      </div>
      <div><div class="streak">🔥 ${D.st}</div><div class="hint">dia(s) seguidos</div>
        ${pct >= 1 ? '<div style="margin-top:6px">✅ Meta batida hoje!</div>' : `<div class="hint" style="margin-top:6px">Faltam ${D.go - D.dp} pontos</div>`}</div>
    </div>
    <div class="grid">
      <div class="card stat"><b>⭐ ${D.pt}</b><span>pontos</span></div>
      <div class="card stat"><b>📚 ${D.ls}</b><span>aulas concluídas</span></div>
      <div class="card stat"><b>🧠 ${D.kn}</b><span>palavras dominadas</span></div>
      <div class="card stat"><b>🎚 ${esc(D.lv)}</b><span>nível</span></div>
    </div>
    <button class="btn" id="go-lesson">${D.inp ? "▶ Continuar aula" : "📚 Fazer a aula de hoje"}</button>
    ${D.cards.length ? `<button class="btn ghost" id="go-cards">🃏 Revisar ${D.due} cartão(ões)</button>` : ""}`;
  $("#go-lesson").onclick = () => send({ t: "go", a: "aula" });
  const gc = $("#go-cards"); if (gc) gc.onclick = () => document.querySelector('nav [data-t="cards"]').click();
  if (D.cards.length) $("#nb").innerHTML = `<span class="badge-n">${D.cards.length}</span>`;
}

// ---- flashcards (arraste: direita = sabia, esquerda = não sabia; toque = virar)
function renderCards() {
  const box = $("#cards");
  if (!D.cards.length) {
    box.innerHTML = `<div class="empty"><div>🎉</div><h1>Nenhum cartão para hoje</h1>
      <p class="hint">Cada aula nova adiciona palavras aqui.</p></div>`; return;
  }
  if (idx >= D.cards.length) return finishCards();
  const c = D.cards[idx];
  box.innerHTML = `
    <h1>Flashcards</h1><div class="hint">${idx + 1} de ${D.cards.length} · toque para virar, arraste para responder</div>
    <div class="bar"><i style="width:${idx / D.cards.length * 100}%"></i></div>
    <div class="deck"><div class="fc" id="fc">
      <div class="face"><div class="word">${esc(c.e)}</div><div class="dots">${"●".repeat(Math.min(c.b, 5))}${"○".repeat(5 - Math.min(c.b, 5))}</div>
        <div class="hint" style="margin-top:14px">Você lembra o significado?</div></div>
      <div class="face back"><div class="pt">${esc(c.p)}</div><div class="ex">“${esc(c.x)}”</div></div>
      <div class="stamp ok">SABIA</div><div class="stamp no">NÃO SABIA</div>
    </div></div>
    <div class="actions">
      <button class="round" id="bno" title="Não sabia">😕</button>
      <button class="round" id="bsay" title="Ouvir">🔊</button>
      <button class="round" id="bok" title="Sabia">😊</button>
    </div>`;
  const fc = $("#fc");
  let x0 = null, dx = 0, moved = false;
  fc.onpointerdown = (e) => { x0 = e.clientX; dx = 0; moved = false; fc.classList.add("drag"); fc.setPointerCapture(e.pointerId); };
  fc.onpointermove = (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true;
    const flip = fc.classList.contains("flip") ? " rotateY(180deg)" : "";
    fc.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)${flip}`;
    fc.querySelector(".stamp.ok").style.opacity = Math.max(0, dx / 100);
    fc.querySelector(".stamp.no").style.opacity = Math.max(0, -dx / 100);
  };
  fc.onpointerup = () => {
    fc.classList.remove("drag"); x0 = null;
    if (!moved) { fc.style.transform = ""; fc.classList.toggle("flip"); haptic("light"); return; }
    if (Math.abs(dx) > 90) return answer(dx > 0);
    fc.style.transform = ""; fc.querySelectorAll(".stamp").forEach((s) => s.style.opacity = 0);
  };
  $("#bok").onclick = () => answer(true);
  $("#bno").onclick = () => answer(false);
  $("#bsay").onclick = () => {
    try { const u = new SpeechSynthesisUtterance(`${c.e}. ${c.x}`); u.lang = "en-US"; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); }
    catch (e) { alert("Áudio indisponível neste aparelho."); }
  };
}
function answer(ok) {
  const fc = $("#fc"); haptic(ok ? "medium" : "heavy");
  fc.style.transition = "transform .3s ease"; fc.style.transform = `translateX(${ok ? 500 : -500}px) rotate(${ok ? 25 : -25}deg)`;
  res.push([D.cards[idx].i, ok ? 1 : 0]); idx++;
  updateMainButton();
  setTimeout(renderCards, 260);
}
function updateMainButton() {
  if (!tg) return;
  tg.MainButton.setText(`Salvar ${res.length} resposta(s)`);
  tg.MainButton.show();
  tg.MainButton.onClick(saveCards);
}
function saveCards() { send({ t: "cards", r: res }); }
function finishCards() {
  const ok = res.filter((r) => r[1]).length;
  $("#cards").innerHTML = `<div class="empty"><div>🏁</div><h1>Revisão concluída!</h1>
    <p>😊 Sabia: <b>${ok}</b> · 😕 Não sabia: <b>${res.length - ok}</b></p>
    <p class="hint">Toque em salvar para registrar e ganhar ⭐ +${ok} pontos.</p>
    <button class="btn" id="save">Salvar resultado</button></div>`;
  $("#save").onclick = saveCards;
}

// ---- mapa do curso (módulos de 10 aulas)
function renderCourse() {
  const nomes = ["Primeiros passos", "Dia a dia", "Mundo real"];
  let html = `<h1>Mapa do curso</h1><div class="hint">${D.ls} de ${D.cur.length} aulas concluídas no ciclo atual</div>`;
  const feitas = D.ls % D.cur.length;
  for (let m = 0; m < Math.ceil(D.cur.length / 10); m++) {
    html += `<div class="mod"><h2>Módulo ${m + 1} · ${nomes[m] || ""}</h2><div class="path">`;
    for (let i = m * 10; i < Math.min(D.cur.length, m * 10 + 10); i++) {
      const cls = i < feitas ? "done" : i === feitas ? "now" : "lock";
      const tag = cls === "done" ? "concluída" : cls === "now" ? "▶ próxima aula" : "🔒";
      html += `<div class="node ${cls}" data-i="${i + 1}">${esc(D.cur[i])}<br><small>${tag}</small></div>`;
    }
    html += `</div></div>`;
  }
  $("#course").innerHTML = html;
}

// ---- conquistas
function renderAch() {
  const n = D.ach.filter((a) => a[2]).length;
  $("#ach").innerHTML = `<h1>Conquistas</h1><div class="hint">${n} de ${D.ach.length} desbloqueadas</div>
    <div class="bar"><i style="width:${n / D.ach.length * 100}%"></i></div><h2></h2>
    <div class="badges">${D.ach.map((a) => `<div class="badge ${a[2] ? "" : "off"}"><div>${a[2] ? a[0] : "🔒"}</div>${esc(a[1])}</div>`).join("")}</div>`;
}
</script>
</body>
</html>
